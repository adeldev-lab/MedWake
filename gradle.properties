# Project properties
APP_ID=org.wakegated.medication
VERSION_NAME=1.2.2
VERSION_CODE=10202

# Strict memory & CPU worker limits to prevent system freeze
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
kotlin.daemon.jvm.options=-Xmx1024m

# AndroidX & R8 Full Mode
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
